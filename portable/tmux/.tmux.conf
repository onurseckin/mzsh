# ------------------------------
# Global Options
# ------------------------------

# Set a new prefix / leader key.
# The default is Ctrl+b. This changes it to the backtick (`) for easier and faster access.
set -g prefix `
bind ` send-prefix

# Set mouse support on
# Allows clicking panes, resizing with mouse, and scrolling.
set -g mouse on

# Start windows and panes at 1, not 0
# Makes it easier to switch windows using the number row on the keyboard (1 is next to `).
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# keeps super key active within specified milliseconds (300ms prevents voice dictation key interception)
set -g repeat-time 300

# Ensure window index numbers get reordered on delete.
# If you close window 2, window 3 automatically becomes window 2.
set -g renumber-windows on

# Allow opening multiple terminals to view the same session at different sizes.
# Prevents tmux from restricting the window size to the smallest connected client unless they are actively viewing it.
setw -g aggressive-resize on

# Use vi keys in copy mode
# Allows you to use Vim-style movement (h, j, k, l, w, b, space, enter) instead of Emacs style when selecting text.
setw -g mode-keys vi
setw -g status-keys vi

# Pass through extended keys and escape sequences (needed for WezTerm / terminal integration).
set -g allow-passthrough on
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Remove delay when switching between Vim modes (zero escape-time delay).
# Tmux normally waits a fraction of a second after pressing Escape to see if it's part of a sequence. Setting to 0 makes Vim instantly responsive.
set -s escape-time 0

# Add a bit more scroll history in the buffer.
# Allows you to scroll back through 50,000 lines of terminal output.
set -g history-limit 50000

# ------------------------------
# Visual
# ------------------------------

# True colors support
# Ensures that terminal applications inside tmux can use the full 24-bit RGB color spectrum.
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*: RGB"

# Status bar
# Sets the background to transparent (default) and text to bright black.
set -g status-style "bg=default,fg=black,bright"

# Left side of status bar: Shows a visual indicator when you press the prefix key (`).
set -g status-left "#{prefix_highlight}"

# Right side of status bar: Shows the name of the current Tmux session.
set -g status-right "#[fg=black,bright]#S"

# Window styles
# Format for inactive windows in the status bar (Index:Name).
set -g window-status-format " #I:#W "

# Format for the active window in the status bar (adds a magnifying glass if zoomed).
set -g window-status-current-format " #I:#W#{?window_zoomed_flag, 🔍,} "

# Colors for the active window (Yellow/Magenta if zoomed).
set -g window-status-current-style "fg=#{?window_zoomed_flag,yellow,magenta},bold"

# Color for a window that has triggered a bell/alert (Red).
set -g window-status-bell-style "fg=red,bold"

# Colors for inactive windows.
set -g window-status-style "fg=black,bright"

# Pane separators
# Sets the color of the lines separating inactive panes.
set -g pane-border-style "fg=black,bright"

# Sets the color of the line separating the active pane.
set -g pane-active-border-style "fg=magenta"

# ------------------------------
# Key Bindings
# ------------------------------

# Unbind default keys
# Removes the default bindings for prefix and pane splitting.
unbind C-b
unbind '"'
unbind %

# Detach protection / lockout: unbind d and C-d to prevent accidental detach on rapid Escape / Ctrl-D / backtick-d bursts
unbind d
unbind -T prefix d
unbind C-d
unbind -n C-d
unbind -T prefix C-d

# IMPORTANT FIX: Unbind mouse dragging at the root level.
# This prevents accidental trackpad micro-clicks from throwing you into Copy Mode when switching panes.
unbind -T root MouseDrag1Pane

# Reload the tmux config.
# Press prefix + r to apply any changes made to this file without restarting tmux.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes preserving current working directory.
# v creates a top/bottom split (horizontal line).
bind v split-window -v -c "#{pane_current_path}"
# b creates a left/right split (vertical line).
bind b split-window -h -c "#{pane_current_path}"

# Move around panes with ALT + arrow keys (no prefix required).
bind -n M-Up select-pane -U
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Right select-pane -R

# Move around panes with directional keys (prefix + h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (prefix + repeat H/J/K/L).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Focus / Zoom
# Zooms the current pane to full screen, hiding others. Press again to unzoom.
bind f resize-pane -Z

# ------------------------------
# Copy Mode (vi) — neovim-like normal mode for the terminal
# ------------------------------
# Enter copy-mode quickly: prefix + Enter, or prefix + Esc.
bind Enter copy-mode
bind Escape copy-mode

# Visual selection like vim.
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Yank to system clipboard (uses tmux-yank under the hood on macOS).
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y   send-keys -X copy-pipe-end-of-line-and-cancel "pbcopy"

# Mouse selection drops the user into copy-mode-vi and yanks on release
# without exiting copy-mode, so they can keep navigating.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

# Quit copy-mode with Esc/q (vim-ish).
bind -T copy-mode-vi q     send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ------------------------------
# tmux plugin manager & plugins
# ------------------------------
# List of plugins
# tpm: The official Tmux Plugin Manager.
set -g @plugin 'tmux-plugins/tpm'

# tmux-sensible: A set of universally accepted default settings for tmux.
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-resurrect: Allows saving and restoring tmux sessions manually.
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: Automatically saves and restores the tmux environment.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank: Enhances copy-to-clipboard functionality across different operating systems.
set -g @plugin "tmux-plugins/tmux-yank"

# tmux-autoreload: Automatically reloads this config file if it detects a change.
set -g @plugin 'b0o/tmux-autoreload'

# tmux-menus: Adds popup menus for managing sessions/windows without memorizing keys (prefix + \).
set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger '\\'

# tmux-fzf: Integrates fuzzy finder for quickly searching and switching things (prefix + F).
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="F"

# tmux-prefix-highlight: Displays a small visual indicator when the prefix key is pressed.
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-which-key: which-key popup guidance for key bindings (prefix + ?).
set -g @plugin 'alexwforsythe/tmux-which-key'

# tmux-thumbs: vimium-style hint mode (prefix + Space).
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key Space
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy && tmux display-message "copied: {}"'

# extrakto: fuzzy text and path extractor (prefix + Tab).
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'tab'
set -g @extrakto_default_opt 'word'
set -g @extrakto_clip_tool 'pbcopy'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
