# yaml-language-server: $schema=config.schema.yaml
command_alias_start_index: 200
keybindings:
  prefix_table: '?'
title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=green,align=centre,bold
position:
  x: R
  y: P
custom_variables:
  - name: log_info
    value: '#[fg=green,italics] [info]#[default]#[italics]'
macros:
  - name: reload-config
    commands:
      - display "#{log_info} Loading config... "
      - source-file $HOME/.tmux.conf
      - display -p "\n\n... Press ENTER to continue"
  - name: restart-pane
    commands:
      - display "#{log_info} Restarting pane"
      - 'respawnp -k -c #{pane_current_path}'
items:
  - name: Thumbs hint mode
    key: space
    command: 'run-shell -b $HOME/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh'
  - name: Extrakto picker
    key: tab
    command: 'run-shell $HOME/.tmux/plugins/extrakto/scripts/open.sh'
  - name: Zoom / Focus pane
    key: f
    command: resizep -Z
  - name: Split vertical
    key: v
    command: 'splitw -v -c #{pane_current_path}'
  - name: Split horizontal
    key: b
    command: 'splitw -h -c #{pane_current_path}'
  - name: Reload config
    key: r
    macro: reload-config
  - name: Copy mode (vi)
    key: Enter
    command: copy-mode
  - separator: true
  - name: +Panes
    key: p
    menu:
      - name: Zoom / Focus
        key: f
        command: resizep -Z
      - name: Split vertical (v)
        key: v
        command: 'splitw -v -c #{pane_current_path}'
      - name: Split horizontal (b)
        key: b
        command: 'splitw -h -c #{pane_current_path}'
      - separator: true
      - name: Choose pane
        key: p
        command: displayp -d 0
      - name: Last pane
        key: tab
        command: lastp
      - separator: true
      - name: Select Left (or M-Left)
        key: h
        command: selectp -L
      - name: Select Down (or M-Down)
        key: j
        command: selectp -D
      - name: Select Up (or M-Up)
        key: k
        command: selectp -U
      - name: Select Right (or M-Right)
        key: l
        command: selectp -R
      - separator: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break to window
        key: '!'
        command: break-pane
      - separator: true
      - name: Mark
        key: m
        command: selectp -m
      - name: Unmark
        key: M
        command: selectp -M
      - name: Capture
        key: C
        command: capture-pane
      - name: Respawn pane
        key: R
        macro: restart-pane
      - name: Kill pane
        key: x
        command: 'confirm -p "Kill pane #P? (y/n)" killp'
      - separator: true
      - name: +Resize
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L
            transient: true
          - name: Down
            key: j
            command: resizep -D
            transient: true
          - name: Up
            key: k
            command: resizep -U
            transient: true
          - name: Right
            key: l
            command: resizep -R
            transient: true
          - name: Left more (10)
            key: H
            command: resizep -L 10
            transient: true
          - name: Down more (10)
            key: J
            command: resizep -D 10
            transient: true
          - name: Up more (10)
            key: K
            command: resizep -U 10
            transient: true
          - name: Right more (10)
            key: L
            command: resizep -R 10
            transient: true
  - name: +Windows
    key: w
    menu:
      - name: New window
        key: c
        command: 'neww -c #{pane_current_path}'
      - name: Choose tree
        key: w
        command: choose-tree -Zw
      - name: Previous window
        key: p
        command: previous-window
      - name: Next window
        key: n
        command: next-window
      - name: Last window
        key: l
        command: last-window
      - separator: true
      - name: Split vertical (v)
        key: v
        command: 'splitw -v -c #{pane_current_path}'
      - name: Split horizontal (b)
        key: b
        command: 'splitw -h -c #{pane_current_path}'
      - name: Rotate
        key: o
        command: rotatew
        transient: true
      - name: Rotate reverse
        key: O
        command: rotatew -D
        transient: true
      - separator: true
      - name: Rename window
        key: R
        command: command-prompt -I "#W" "renamew -- \"%%\""
      - name: Kill window
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'
      - separator: true
      - name: +Layout
        key: L
        menu:
          - name: Next layout
            key: l
            command: nextl
            transient: true
          - name: Tiled (M-5)
            key: t
            command: selectl tiled
          - name: Even Horizontal (M-1)
            key: h
            command: selectl even-horizontal
          - name: Even Vertical (M-2)
            key: v
            command: selectl even-vertical
          - name: Main Horizontal (M-3)
            key: H
            command: selectl main-horizontal
          - name: Main Vertical (M-4)
            key: V
            command: selectl main-vertical
  - name: +Sessions
    key: s
    menu:
      - name: Choose session
        key: s
        command: choose-tree -Zs
      - name: New session
        key: N
        command: 'command-prompt -p "New session name:" "new-session -s \"%%\""'
      - name: Rename session
        key: r
        command: 'command-prompt -I "#S" "rename-session -- \"%%\""'
      - separator: true
      - name: Save session (Resurrect C-s)
        key: S
        command: run-shell $HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh
      - name: Restore session (Resurrect C-r)
        key: R
        command: run-shell $HOME/.tmux/plugins/tmux-resurrect/scripts/restore.sh
      - separator: true
      - name: Detach
        key: d
        command: detach
      - name: Suspend
        key: Z
        command: suspendc
  - name: +Copy & Buffers
    key: c
    menu:
      - name: Enter copy-mode (vi)
        key: c
        command: copy-mode
      - name: Paste buffer
        key: p
        command: paste-buffer -p
      - name: Choose buffer
        key: b
        command: choose-buffer -Z
      - name: List buffers
        key: l
        command: list-buffers
      - separator: true
      - name: Copy line (tmux-yank y)
        key: y
        command: run-shell -b $HOME/.tmux/plugins/tmux-yank/scripts/copy_line.sh
      - name: Copy pane PWD (tmux-yank Y)
        key: Y
        command: run-shell -b $HOME/.tmux/plugins/tmux-yank/scripts/copy_pane_pwd.sh
  - name: +Plugins & Extensions
    key: P
    menu:
      - name: TPM Install (I)
        key: i
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/install_plugins
      - name: TPM Update (U)
        key: u
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/update_plugins
      - name: TPM Clean (M-u)
        key: c
        command: run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/clean_plugins
      - separator: true
      - name: TMUX FZF Finder (F)
        key: F
        command: run-shell -b $HOME/.tmux/plugins/tmux-fzf/main.sh
      - name: TMUX Menus (\)
        key: m
        command: run-shell $HOME/.tmux/plugins/tmux-menus/items/main.sh
      - name: Thumbs hint mode (Space)
        key: t
        command: run-shell -b $HOME/.tmux/plugins/tmux-thumbs/tmux-thumbs.sh
      - name: Extrakto picker (Tab)
        key: e
        command: 'run-shell $HOME/.tmux/plugins/extrakto/scripts/open.sh'
      - separator: true
      - name: Reload config (r)
        key: r
        macro: reload-config
      - name: Customize (,)
        key: ','
        command: customize-mode -Z
  - separator: true
  - name: TMUX FZF Finder
    key: F
    command: run-shell -b $HOME/.tmux/plugins/tmux-fzf/main.sh
  - name: TMUX Menus popup
    key: "\\"
    command: run-shell $HOME/.tmux/plugins/tmux-menus/items/main.sh
  - name: Command prompt
    key: ':'
    command: command-prompt
  - name: Time / Clock
    key: T
    command: clock-mode
  - name: Show messages
    key: '~'
    command: show-messages
  - name: +List all keys (-N)
    key: '?'
    command: list-keys -N
